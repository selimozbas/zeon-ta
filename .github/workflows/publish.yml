name: Publish to PyPI

# Publishing uses PyPI Trusted Publishing (OIDC), so no API token is stored in
# this repository. Configure the publisher once at
# https://pypi.org/manage/project/zeon-ta/settings/publishing/ with:
#   owner/repo = <your GitHub repo>, workflow = publish.yml, environment = pypi
#
# No step interpolates event data into a shell command; the tag that triggered
# the run is never echoed or evaluated.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify tag matches project version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $PROJECT_VERSION"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches project version $PROJECT_VERSION"

      - name: Verify before publishing
        run: |
          pytest
          ruff check .
          ruff format --check .
          mypy src/
          python tools/gen_docs.py --check

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zeon-ta
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
