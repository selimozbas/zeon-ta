[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "zeon-ta"
version = "0.3.0"
description = "Technical analysis for Python — the classic indicator set alongside modern, academically-sourced tools like Ehlers' cycle filters and OHLC volatility estimators."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Selim Ozbas", email = "selimozbas@gmail.com" }]
keywords = [
    "technical-analysis",
    "technical-indicators",
    "trading-indicators",
    "indicators",
    "trading",
    "algorithmic-trading",
    "quantitative-finance",
    "finance",
    "quant",
    "pandas",
    "numpy",
    "rsi",
    "macd",
    "bollinger-bands",
    "ta",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["numpy>=2.5.2", "pandas>=3.0", "pywavelets>=1.9"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "pandas-stubs",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/selimozbas/zeon-ta"
Documentation = "https://selimozbas.github.io/zeon-ta/"
Repository = "https://github.com/selimozbas/zeon-ta"
Changelog = "https://github.com/selimozbas/zeon-ta/blob/main/CHANGELOG.md"
Issues = "https://github.com/selimozbas/zeon-ta/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zeonta"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/benchmarks",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/BENCHMARKS.md",
    "/ROADMAP.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Markdown under docs/ and the README are generated by tools/gen_docs.py; their
# code blocks come from ast.unparse and are verified by execution, not by ruff.
extend-exclude = ["docs", "README.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D"]
ignore = [
    "N803",    # finance conventions: K, D, TR as argument names
    "N806",    # ...and as local variable names
    "RUF001",  # Turkish prose legitimately contains non-ASCII look-alikes
    "RUF002",
    "RUF003",
    "D105",    # magic methods (__getattr__, __dir__, ...) are self-explanatory
    "D107",    # __init__ documented by its class docstring instead (PEP 257 permits either)
    "D401",    # every indicator's docstring opens with the indicator's own name
               # ("Simple Moving Average.", "True Range...") to match how it's referred
               # to everywhere else (README, docs, tests) - imperative mood would fight
               # that established, deliberate convention rather than improve it
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "D"]                    # test names are the documentation
"tools/docs_content.py" = ["E501", "D"]      # long prose strings; internal build content
"tools/gen_docs.py" = ["D"]                  # internal build script, not public API
"benchmarks/*" = ["D"]                       # internal script, not public API

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pandas.*", "pywt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src/zeonta"]
addopts = "-q --strict-markers --doctest-modules"
filterwarnings = ["error"]
